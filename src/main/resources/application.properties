# Conexión a la base de datos MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/sapo?useSSL=false&serverTimezone=UTC
spring.datasource.username=root

# Contraseña del usuario root (solo para entorno local)
spring.datasource.password=%LQSyM#18041309

# Driver JDBC de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate actualiza las tablas según los modelos (útil en desarrollo)
