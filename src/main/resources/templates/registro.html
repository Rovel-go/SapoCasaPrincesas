<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>

    <style>
        .error-msg {
            color: red;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .ok-msg {
            color: green;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        label { font-weight: bold; }
        input { margin-bottom: 5px; }
    </style>
</head>
<body>

<h2>Registro de usuario</h2>



<!-- MENSAJES DE ERROR DESDE EL CONTROLADOR -->
<div th:switch="${#strings.trim(param.error)}">
    <div th:case="'campos-vacios'" class="error-msg">
        Debe completar todos los campos.
    </div>
    <div th:case="'contraseña-corta'" class="error-msg">
        La contraseña debe tener al menos 6 caracteres.
    </div>
    <div th:case="'email-existe'" class="error-msg">
        El correo electrónico ya está registrado.
    </div>
</div>






<form th:action="@{/registrar}" method="post">

    <label>Nombre:</label><br>
    <input type="text" name="nombre" required>
    <br/>

    <label>Apellidos:</label><br>
    <input type="text" name="apellidos" required>
    <br/>

    <label>Email:</label><br>
    <input type="email" name="email" required>
    <br/>

    <label>Contraseña:</label><br>
    <input type="password" name="password" required minlength="6">
    <br/>

    <button type="submit">Registrarse</button>
</form>

<p>
    <a th:href="@{/login}">Volver al login</a>
</p>




</body>
</html>
